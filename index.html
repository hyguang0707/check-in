<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>員工打卡系統</title>
  <!-- 引入 Tailwind CSS 讓介面好看又現代 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md mx-4">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">員工打卡系統</h1>
    
    <!-- 打卡表單 -->
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">請輸入 4 位數 PIN 碼</label>
        <input type="password" id="pinInput" maxlength="4" placeholder="例如: 0305" 
          class="w-full px-4 py-3 border border-gray-300 rounded-xl text-center text-2xl tracking-widest focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <div class="flex gap-4 pt-2">
        <button onclick="handlePunch('上班')" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl transition">
          上班打卡
        </button>
        <button onclick="handlePunch('下班')" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition">
          下班打卡
        </button>
      </div>
    </div>

    <!-- 訊息提示 -->
    <div id="message" class="mt-6 text-center text-sm font-medium"></div>
  </div>

<script>
    // ===== 填入你的 Supabase 專案資訊 =====
    const SUPABASE_URL = 'https://klgubwkrkoeqnndowijj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_zgTOZmoPRNhgm1ZFBdnD0w_GpqpLT0D'; 
    const sbSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handlePunch(type) {
      const pin = document.getElementById('pinInput').value.trim();
      const msgDiv = document.getElementById('message');

      if (pin.length !== 4) {
        msgDiv.textContent = '請輸入正確的 4 位數 PIN 碼！';
        msgDiv.className = 'mt-6 text-center text-sm font-medium text-red-500';
        return;
      }

      msgDiv.textContent = '驗證中...';
      msgDiv.className = 'mt-6 text-center text-sm font-medium text-gray-500';

      try {
        // 1. 根據 PIN 碼去 employees 找尋員工名字
        const { data: employee, error: empError } = await sbSupabase
          .from('employees')
          .select('name')
          .eq('pin_code', pin)
          .single();

        if (empError || !employee) {
          throw new Error('找不到此 PIN 碼對應的員工，請確認是否輸入正確。');
        }

        // 2. 將打卡紀錄寫入 punch_logs 資料表（對應真實欄位）
        const { error: punchError } = await sbSupabase
          .from('punch_logs')
          .insert([
            { 
              employee_name: employee.name,
              action_type: type
            }
          ]);

        if (punchError) throw punchError;

        msgDiv.textContent = `🎉 ${employee.name} - ${type}打卡成功！`;
        msgDiv.className = 'mt-6 text-center text-sm font-medium text-green-600';
        document.getElementById('pinInput').value = '';

      } catch (err) {
        msgDiv.textContent = err.message;
        msgDiv.className = 'mt-6 text-center text-sm font-medium text-red-500';
      }
    }
  </script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => {
          console.log('Service Worker 註冊成功:', reg.scope);
        })
        .catch((err) => {
          console.log('Service Worker 註冊失敗:', err);
        });
    });
  }
</script>
</body>
</html>
